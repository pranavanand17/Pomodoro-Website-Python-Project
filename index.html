<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header>
            <h1>Pomodoro</h1>
            <p>Focus. Study. Repeat.</p>
        </header>

        <section class="timer-card">

            <div class="modes">
                <button id="focusMode" class="mode active">
                    Focus
                </button>

                <button id="shortBreakMode" class="mode">
                    Short Break
                </button>

                <button id="longBreakMode" class="mode">
                    Long Break
                </button>
            </div>

            <div id="timer" class="timer">
                25:00
            </div>

            <p id="status" class="status">
                Time to focus.
            </p>

            <button id="startButton" class="start-button">
                START
            </button>

            <div class="rounds">
                <span>Round</span>
                <strong id="roundNumber">1</strong>
                <span>of 4</span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
